<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Your recipes - Badger Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&family=Montserrat:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="../icon-192.png">
</head>
<body>
<div class="bar" id="bar">
  <div class="bar-in">
    <span class="prog" id="prog">Loading your recipes...</span>
    <span class="status" id="status" aria-live="polite"></span>
  </div>
  <div class="track"><div class="fill" id="fill"></div></div>
</div>

<main id="main">
  <header class="top">
    <img class="mark" src="../brand/badger-holdings-mark.png" alt="" width="44" height="44">
    <div>
      <h1>Recipes</h1>
      <p class="sub" id="whoLine"></p>
    </div>
  </header>

  <section class="changes" id="changes" hidden></section>

  <section class="notes" id="notes"></section>

  <nav class="jump" id="jump" aria-label="Menu groups"></nav>
  <div class="filter" id="filter">
    <button type="button" class="chip on" data-show="all">All</button>
    <button type="button" class="chip" data-show="todo">Not checked yet</button>
  </div>

  <div id="list"><p class="loading">Loading...</p></div>

  <section class="block" id="addBlock" hidden>
    <h2>Missing a recipe?</h2>
    <p class="small">Add it here and fill in its ingredients.</p>
    <div class="row">
      <input id="addName" type="text" maxlength="120" placeholder="Recipe name" aria-label="New recipe name">
      <select id="addCat" aria-label="Menu group"></select>
      <button type="button" class="btn" id="addBtn">Add</button>
    </div>
  </section>

  <section class="block" id="leftOut"></section>

  <section class="block" id="anything">
    <h2>Anything else</h2>
    <p class="small">Anything that does not fit a recipe: a dish that is missing, a supplier, a question.</p>
    <textarea id="anythingElse" rows="5" maxlength="8000" placeholder="Write here..."></textarea>
  </section>
  <p class="foot" id="foot"></p>
</main>

<datalist id="itemList"></datalist>
<script type="module" src="app.js"></script>
</body>
</html>
